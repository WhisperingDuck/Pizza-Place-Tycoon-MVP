<header class="mast">
<div class="brand"><span class="illustration" data-art="brand" aria-hidden="true"></span><h1><span data-ui="brand"></span><small data-ui="brandSub"></small></h1></div>
<div class="daybox"><b id="day"></b><small class="phase" id="phase"></small></div>
<dl class="stats"><div class="stat"><dt data-ui="cash"></dt><dd id="cash"></dd></div><div class="stat"><dt data-ui="health"></dt><dd id="health"></dd></div><div class="stat"><dt data-ui="reputation"></dt><dd id="rep"></dd></div></dl>
</header>
<section class="world" id="world"><canvas id="scene" width="640" height="220" role="img"></canvas>
<div class="world-top"><div class="route"><span class="route-sign" aria-hidden="true">1</span><span data-ui="route"></span></div><span class="clock"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="6"/><path d="M8 4v4l3 1"/></svg><span id="clock"></span></span></div>
<span class="scene-stamp"><i class="lamp"></i><span id="sceneLabel"></span></span><div id="bubble" class="scene-reaction" hidden><small id="bubbleTag"></small><span id="bubbleLine"></span></div>
</section>
<div class="bar"><h2 id="benchLabel"></h2><nav class="links" id="tools"><button class="link" data-dialog="stock" data-ui="stockroom"></button><button class="link" data-dialog="equipment" data-ui="equipment"></button><button class="link" data-dialog="log" data-ui="logShort"></button></nav></div>
<section id="prep" class="bench">
<section class="block" data-station="dough"><div class="titleline"><h3 data-ui="doughStation"></h3><span class="count-tag" id="doughCount"></span></div><div class="ingredients" id="flourRow"></div><div class="workrow"><button class="workbutton" data-action="dough"><span id="doughAction"></span><span aria-hidden="true" class="arrow" id="doughPct"></span></button><p class="requirement" id="doughHint"></p></div></section>
<section class="block" data-station="slices"><div class="titleline"><h3 data-ui="sliceStation"></h3><span class="count-tag" id="trayCount"></span></div><div class="ingredients" id="fillRows"></div><div class="workrow"><button class="workbutton" data-action="prepare"><span id="slicesAction"></span><span class="arrow" aria-hidden="true" id="slicesPct"></span></button><p class="requirement" id="slicesHint"></p></div></section>
<section class="block price-block"><div class="titleline"><h3 data-ui="priceBoard"></h3></div><div class="price-line"><button class="step" data-action="price" data-id="-1" id="priceDown">−</button><strong class="price-main" id="price"></strong><button class="step" data-action="price" data-id="1" id="priceUp">+</button></div><dl class="forecast"><div><dt data-ui="visitors"></dt><dd id="forecastVisitors"></dd></div><div><dt data-ui="capacity"></dt><dd id="capacity"></dd></div><div><dt data-ui="chance"></dt><dd id="chance"></dd></div></dl><div class="price-foot"><span><span data-ui="potentialShort"></span> <b id="possibleSales"></b></span><span><span data-ui="spentSoFar"></span> <b id="spending"></b></span></div></section>
</section>
<section class="live-grid" id="service" hidden>
<div class="live-totals"><h3 class="section-head" data-ui="window"></h3><div class="counter-figures"><div><b id="sold"></b><span data-ui="sold"></span></div><div><b id="left"></b><span data-ui="remaining"></span></div><div><b id="takings"></b><span data-ui="sales"></span></div></div><div class="timeline"><i id="serviceFill"></i></div><p class="live-status" id="serviceCount"></p></div>
<div><div class="log-head"><h3 class="section-head" data-ui="counterLog"></h3><button class="link" data-dialog="log" data-ui="fullLog"></button></div><ol class="log inline" id="liveLog"></ol></div>
</section>
<section class="report-grid" id="report" hidden><div class="receipt"><header><h3 class="section-head" data-ui="receipt"></h3><small id="receiptNumber"></small></header><dl><div><dt data-ui="soldPrepared"></dt><dd id="rSold"></dd></div><div><dt data-ui="sales"></dt><dd id="rSales"></dd></div><div><dt data-ui="leftovers"></dt><dd id="rLeft"></dd></div><div><dt data-ui="spending"></dt><dd id="rSpent"></dd></div></dl><div class="ledger-tot"><span data-ui="change"></span><b id="rChange"></b></div></div>
<div class="report-notes"><div><span class="kicker" data-ui="tomorrow"></span><p id="rClue"></p></div><div class="eventline"><span class="kicker" id="eventTitle"></span><p id="rEvent"></p><button id="readNote" class="link" data-dialog="note" data-ui="fullReceipt" hidden></button></div></div>
</section>
<div class="task"><div class="task-copy"><strong id="taskTitle"></strong><small id="taskHint"></small></div><button class="equipmentBuy" id="buyMicrowave" data-action="microwave"></button><button class="main-action" id="primary"></button></div>
</div>
<footer class="floor"><span class="floor-left" data-ui="edition"></span><span class="floor-status" id="floorStatus"></span><button class="link" data-dialog="reset" data-ui="resetSample"></button></footer>
</main>
<dialog id="sheet" aria-labelledby="sheetTitle"><div class="sheet-inner"><header class="sheet-top"><h2 id="sheetTitle"></h2><button class="smallbutton" id="closeSheet" data-ui="back"></button></header><div id="sheetBody" class="sheet-scroll"></div></div></dialog>
<div class="sr" aria-live="polite" aria-atomic="true" id="announce"></div>
<script>
(()=>{
'use strict';
const el=id=>document.getElementById(id);
const each=(selector,fn)=>document.querySelectorAll(selector).forEach(fn);
const fmt=n=>'$'+(Math.abs(n||0)/100).toFixed(2), signed=n=>(n<0?'−':n>0?'+':'')+fmt(n);
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const replace=(text,values={})=>String(text??'').replace(/\{(\w+)\}/g,(_,key)=>String(values[key]??''));
let vm,ui,activeDialog='',opener=null,lastPhase='',lastSheet='',lastLog='',previousNotice='',previousReaction='';
const pictures={
 brand:['.......rrr..','.....rryyyr.','...rryyttyr.','.rryttyyyyr.','ryyytyyyyr..','rrtyyttyyr..','.rryytyyr...','..rtyyyyr...','...ryyyr....','....ryr.....','.....r......'],
 flour:['..ggggg...','..gpppg...','...gpg....','..gpppg...','.gpppppg..','.gpgggpg..','.gpgpgpg..','.gpgggpg..','.gpppppg..','.ggggggg..'],
 sauce:['..gggggg..','.gwwwwwwg.','.gggggggg.','.gtrrrrtg.','.gtrpprtg.','.gtrpprtg.','.gtrrrrtg.','.gggggggg.','.gwwwwwwg.','..gggggg..'],
 cheese:['.......yy.','.....yyty.','...yyytty.','.yyyyytyg.','gyyyyyggg.','gyyyggyyg.','gyggytyyg.','ggyyyytyg.','..ggyyyyg.','....ggggg.'],
 napkins:['..........','...ggggg..','..gwwwwgg.','.gwwwgwwg.','.gwwgwwwg.','.gwgwwwwg.','.ggwwwwwg.','.gggggggg.','..........','..........'],
 paper_plates:['..........','...gggg...','..gwwwwg..','.gwggggwg.','.gwgwwgwg.','.gwgwwgwg.','.gwggggwg.','..gwwwwg..','...gggg...','..........']};
const palette={g:'#3e5a43',p:'#e7d5a4',r:'#8f412d',y:'#e4bf6e',t:'#af5737',w:'#faf2d5'};
function art(key){const rows=pictures[key];if(!rows)return '';let paths='';for(let y=0;y<rows.length;y++)for(let x=0;x<rows[y].length;x++)if(palette[rows[y][x]])paths+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+palette[rows[y][x]]+'"/>';return '<svg viewBox="0 0 '+rows[0].length+' '+rows.length+'" width="100%" height="100%" shape-rendering="crispEdges" aria-hidden="true">'+paths+'</svg>';}
function stockRow(id,prefix){return '<div class="ingredient"><span aria-hidden="true" class="illustration">'+art(id)+'</span><span class="iname">'+safe(ui[id])+'</span><span class="onhand" id="'+prefix+id+'Count"></span><button class="buy" data-action="buy" data-id="'+id+'" id="'+prefix+id+'Buy"></button></div>';}
function stockPaint(id,prefix){const n=vm.stock[id]||0, cost=vm.costs[id]||0;const item=ui[id],btn=el(prefix+id+'Buy');el(prefix+id+'Count').textContent=n;el(prefix+id+'Count').setAttribute('aria-label',replace(ui.onHand,{count:n,item}));btn.textContent=replace(ui.buyPrice,{cost:fmt(cost).replace(/\.00$/,'')});btn.setAttribute('aria-label',replace(ui.buyDetail,{item,cost:fmt(cost),count:n}));btn.title=vm.buyReason?.[id]||'';btn.disabled=vm.phase!=='prep'||vm.canBuy?.[id]===false;}
function put(id,v){const n=el(id),s=String(v??'');if(n.textContent!==s)n.textContent=s;}
function logRows(items,limit){return [...items].reverse().slice(0,limit).map(row=>'<li><time>'+safe(row.time)+'</time><span>'+safe(row.text)+'</span></li>').join('');}
function dispatch(action,id){window.Stand.action(action,id);}
function work(kind,buttonAction){
 const button=document.querySelector('[data-action="'+buttonAction+'"]'),working=vm.work?.kind===kind,otherWork=vm.work&&!working;
 const ready=kind==='dough'?vm.canDough:vm.canPrepare;
 const progress=working?vm.work.progress:0;
 button.disabled=Boolean(otherWork)||!ready&&!working;button.style.setProperty('--fill',progress+'%');
 put(kind+'Action',working?ui[kind+'More']:ui[kind+'Start']);put(kind+'Pct',working?progress+'%':'→');
 button.setAttribute('aria-describedby',kind+'Hint');
 let missing=[];if(!vm.stock.dough)missing.push(ui.dough);if(!vm.stock.sauce)missing.push(ui.sauce);if(!vm.stock.cheese)missing.push(ui.cheese);
 const hint=working?replace(ui.workProgress,{progress}):otherWork?ui.finishWork:kind==='dough'?(vm.stock.flour?ui.doughRecipe:replace(ui.need,{items:ui.flour})):missing.length?replace(ui.need,{items:missing.join(' + ')}):ui.slicesRecipe;
 put(kind+'Hint',hint);
}
function prep(){
 ['flour','sauce','cheese'].forEach(id=>stockPaint(id,'p'));put('doughCount',replace(ui.doughCount,{count:vm.stock.dough}));put('trayCount',replace(ui.trayCount,{count:vm.stock.slices}));
 work('dough','dough');work('slices','prepare');put('price',fmt(vm.price));el('priceDown').disabled=vm.price<=vm.priceMin;el('priceUp').disabled=vm.price>=vm.priceMax;
 put('forecastVisitors',vm.forecast.visitors);put('capacity',vm.forecast.capacity);put('chance',vm.forecast.chance+'%');
 let title;if(vm.work)title=vm.work.kind==='dough'?ui.taskDough:ui.taskSlices;else if(vm.ready)title=ui.taskReady;else if(vm.stock.slices>0&&!vm.microwave)title=ui.taskMicrowave;else if(!vm.stock.flour&&!vm.stock.dough)title=ui.taskFlour;else if(!vm.stock.dough)title=ui.taskDough;else if(!vm.stock.sauce||!vm.stock.cheese)title=ui.taskToppings;else title=ui.taskSlices;
 put('taskTitle',title);const notes=[];if(!vm.microwave)notes.push(ui.needMicrowave);if(!vm.stock.slices)notes.push(ui.needTray);if(vm.work)notes.push(ui.finishWorkShort);put('taskHint',vm.ready?replace(ui.readyHint,{count:vm.stock.slices,price:fmt(vm.price)}):notes.join(' · '));
 const micro=el('buyMicrowave');micro.hidden=vm.microwave;micro.disabled=vm.canBuy?.microwave===false;put('buyMicrowave',replace(ui.buyMicrowave,{cost:fmt(vm.costs.microwave).replace(/\.00$/,'')}));
 el('primary').disabled=!vm.ready;el('primary').dataset.action='open';put('primary',ui.open);
}
function service(){
 put('sold',vm.sold);put('left',vm.stock.slices);put('takings',fmt(vm.sales));el('serviceFill').style.width=Math.round(vm.serviceProgress*100)+'%';
 put('serviceCount',replace(ui.visitorCount,{count:vm.visitorsSeen,total:vm.forecast.visitors}));
 const list=logRows(vm.log||[],4);if(list!==lastLog){el('liveLog').innerHTML=list;lastLog=list;}
 const rx=vm.reaction||null, bubble=el('bubble');bubble.hidden=!rx?.text;
 if(rx?.text){put('bubbleTag',replace(ui.visitor,{n:rx.visitor})+(rx.amount?'  +'+fmt(rx.amount):''));put('bubbleLine',rx.text);}
 put('taskTitle',vm.paused?ui.servicePaused:!rx?ui.serviceStarted:rx.amount?ui.serviceSale:rx.kind==='arriving'?ui.serviceArrival:ui.servicePass);
 put('taskHint',rx?.amount?replace(ui.paid,{paid:fmt(rx.amount),n:rx.visitor}):rx?replace(ui.visitor,{n:rx.visitor}):ui.waiting);
 el('buyMicrowave').hidden=true;el('primary').disabled=false;el('primary').dataset.action='pause';put('primary',vm.paused?ui.resume:ui.pause);
}
function report(){
 const r=vm.receipt;if(!r)return;
 put('receiptNumber',replace(ui.receiptNo,{day:String(vm.day).padStart(2,'0')}));put('rSold',r.sold+' / '+r.prepared);put('rLeft',r.leftovers);put('rSales',fmt(r.sales));put('rSpent',fmt(r.spending));put('rChange',signed(r.change));el('rChange').classList.toggle('costneg',r.change<0);
 put('rClue',r.clue);put('eventTitle',r.eventTitle||ui.event);put('rEvent',r.eventMessage||ui.noEvent);put('taskTitle',ui.dayClosed);put('taskHint',replace(ui.closeBalance,{cash:fmt(vm.cash),health:vm.health}));el('buyMicrowave').hidden=true;el('primary').disabled=false;el('primary').dataset.action=vm.dayTerminal?'reset':'next';put('primary',vm.dayTerminal?ui.resetSample:replace(ui.next,{day:vm.day+1}));
}
function paintSheet(force=false){
 if(!activeDialog)return;const names={stock:ui.stockroom,equipment:ui.equipment,log:ui.counterLog,reset:ui.resetTitle,note:ui.receiptDetail};put('sheetTitle',names[activeDialog]);
 let html='';const D=activeDialog,key=[D,vm.phase,vm.cash,vm.stock.flour,vm.stock.sauce,vm.stock.cheese,vm.stock.napkins,vm.stock.paper_plates,vm.microwave,vm.log?.length,vm.receipt?.eventMessage].join('|');
 if(!force&&lastSheet===key)return;lastSheet=key;
 if(D==='stock'){
   html='<div class="large-line"><h3>'+safe(ui.budget)+'</h3><b>'+fmt(vm.cash)+'</b></div><h3>'+safe(ui.ingredients)+'</h3>'+['flour','sauce','cheese'].map(id=>stockRow(id,'m')).join('')+'<h3 style="margin-top:16px">'+safe(ui.supplies)+'</h3>'+['napkins','paper_plates'].map(id=>stockRow(id,'m')).join('')+'<p class="sheet-note">'+safe(vm.phase==='prep'?ui.stockHint:ui.readOnly)+'</p>';
   const unaffordable=['flour','sauce','cheese','napkins','paper_plates'].filter(id=>vm.phase==='prep'&&!vm.canBuy[id]);if(unaffordable.length)html+='<p>'+safe(ui.noFunds)+' '+safe(unaffordable.map(id=>ui[id]).join(', '))+'</p>';
 } else if(D==='equipment'){
   html='<div class="large-line"><strong>'+safe(ui.equipmentName)+'</strong>'+(vm.microwave?'<b>'+safe(ui.owned)+'</b>':'<button class="smallbutton" data-action="microwave" '+(!vm.canBuy.microwave?'disabled':'')+'>'+safe(replace(ui.buyMicrowave,{cost:fmt(vm.costs.microwave)}))+'</button>')+'</div><p>'+safe(ui.microwaveHint)+'</p>';
   if(!vm.microwave&&!vm.canBuy.microwave)html+='<p>'+safe(vm.buyReason.microwave)+'</p>';
 } else if(D==='log'){
   html=vm.log?.length?'<ol class="log">'+logRows(vm.log,Number.MAX_SAFE_INTEGER)+'</ol>':'<p>'+safe(ui.fullLogEmpty)+'</p>';
   if(vm.phase==='service')html+='<p class="sheet-note">'+safe(ui.pauseInPanel)+'</p>';
 } else if(D==='note'){
   html='<h3>'+safe(ui.tomorrow)+'</h3><p>'+safe(vm.receipt?.clue)+'</p><h3>'+safe(vm.receipt?.eventTitle||ui.event)+'</h3><p>'+safe(vm.receipt?.eventMessage||ui.noEvent)+'</p>';
 } else {
   html='<p>'+safe(ui.resetDetail)+'</p><button class="smallbutton" data-confirm-reset>'+safe(ui.resetConfirm)+'</button>';
 }
 const focusIn=el('sheetBody').contains(document.activeElement)?document.activeElement:null;
 const focusKey=focusIn?.dataset.action,focusId=focusIn?.dataset.id,scroll=el('sheetBody').scrollTop;
 el('sheetBody').innerHTML=html;if(D==='stock')['flour','sauce','cheese','napkins','paper_plates'].forEach(id=>stockPaint(id,'m'));
 if(focusKey){const restored=[...el('sheetBody').querySelectorAll('button')].find(b=>b.dataset.action===focusKey&&b.dataset.id===focusId&&!b.disabled);(restored||el('closeSheet')).focus({preventScroll:true});}
 el('sheetBody').scrollTop=scroll;
}
function show(type,button){opener=button;activeDialog=type;lastSheet='';dispatch('panel',true);paintSheet(true);el('sheet').showModal();window.StandScene?.paint(vm);el('closeSheet').focus({preventScroll:true});}
function close(){if(el('sheet').open)el('sheet').close();}
el('sheet').addEventListener('close',()=>{activeDialog='';lastSheet='';dispatch('panel',false);window.StandScene?.paint(vm);if(opener?.isConnected&&!opener.disabled)opener.focus({preventScroll:true});opener=null;});
el('sheet').addEventListener('click',e=>{if(e.target!==el('sheet'))return;const r=el('sheet').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();});
el('closeSheet').addEventListener('click',close);
document.addEventListener('keydown',e=>{
 if(!el('sheet').open)return;
 if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close();return;}
 if(e.key!=='Tab')return;
 const buttons=[...el('sheet').querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),[tabindex="0"]')].filter(node=>node.getClientRects().length);
 if(!buttons.length)return;
 e.preventDefault();const index=buttons.indexOf(document.activeElement);
 const next=index<0?(e.shiftKey?buttons.length-1:0):(index+(e.shiftKey?-1:1)+buttons.length)%buttons.length;
 buttons[next].focus();
},true);
document.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button||button.disabled)return;
 if(button.hasAttribute('data-confirm-reset')){close();opener=document.querySelector('[data-dialog=reset]');dispatch('reset');return;}
 if(button.dataset.dialog){show(button.dataset.dialog,button);return;}
 if(button.dataset.action)dispatch(button.dataset.action,button.dataset.id);
});
function init(){
 each('[data-ui]',node=>node.textContent=ui[node.dataset.ui]);each('[data-art]',node=>node.innerHTML=art(node.dataset.art));
 el('tools').setAttribute('aria-label',ui.tools);el('priceDown').setAttribute('aria-label',ui.lowerPrice);el('priceUp').setAttribute('aria-label',ui.raisePrice);
 el('flourRow').innerHTML=stockRow('flour','p');el('fillRows').innerHTML=stockRow('sauce','p')+stockRow('cheese','p');
 el('primary').setAttribute('aria-describedby','taskTitle taskHint');
}
function updateClock(){
 const minutes=vm.phase==='prep'?600:vm.phase==='report'?1140:660+Math.floor(480*vm.serviceProgress);
 put('clock',String(Math.floor(minutes/60)).padStart(2,'0')+':'+String(minutes%60).padStart(2,'0'));
}
function receiptOverflow(){
 if(vm?.phase!=='report'||!vm.receipt)return;
 const clipped=['rClue','eventTitle','rEvent'].some(id=>{const n=el(id);return n.scrollHeight>n.clientHeight+1;});
 el('readNote').hidden=!(vm.receipt.eventTitle||clipped);
}
window.addEventListener('resize',receiptOverflow);
function render(model,content){
 const first=!ui;vm=model;ui=content.ui;if(first)init();
 const phase=vm.phase,shift=lastPhase&&lastPhase!==phase,wasOnPhaseControl=shift&&(document.activeElement===el('primary')||[el('prep'),el('service'),el('report')].some(p=>p.contains(document.activeElement)));
 ['prep','service','report'].forEach(s=>el(s).hidden=s!==phase);
 put('day',replace(ui.day,{day:String(vm.day).padStart(2,'0')}));put('phase',ui[phase+'Phase']);put('cash',fmt(vm.cash));put('health',vm.health+ui.healthSuffix);put('rep',vm.reputation);put('benchLabel',ui[phase+'Bench']);
 const scenePhase=phase[0].toUpperCase()+phase.slice(1);put('sceneLabel',ui['scene'+scenePhase]);el('scene').setAttribute('aria-label',ui['sceneAlt'+scenePhase]);el('world').dataset.phase=phase;updateClock();el('bubble').hidden=true;
 if(phase==='prep'){prep();put('possibleSales',fmt(vm.possibleSales));put('spending',fmt(vm.spending));}else if(phase==='service')service();else report();
 if(vm.saveNotice)put('floorStatus',vm.saveNotice);else put('floorStatus',phase==='prep'?vm.notice:'');
 const announce=phase==='service'?vm.log?.at(-1)?.text:phase==='report'&&shift?ui.dayClosed:vm.notice;
 if(announce&&previousNotice!==announce){put('announce',announce);previousNotice=announce;}
 if(phase==='report')receiptOverflow();
 if(!activeDialog&&wasOnPhaseControl){const node=phase==='prep'?el('pflourBuy'):el('primary');node.focus({preventScroll:true});}
 lastPhase=phase;paintSheet();window.StandScene?.paint(vm);
}
window.StandView={render};
})();
</script>

<script>
(function (P) {
  'use strict';
  const C = P.CONFIG;
  const sum = obj => Object.values(obj).reduce((a, b) => a + b, 0);
  const clamp = (n, low, high) => Math.max(low, Math.min(high, n));
  function random(s) {
    // Saveable PRNG: reloading a prepared day does not reroll its luck.
    s.rng = (s.rng + 0x6D2B79F5) >>> 0;
    let t = s.rng;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  function log(s, type, text) {
    s.log.push({ id: ++s.logId, day: s.day, type, text });
    if (s.log.length > C.maxLog) s.log.shift();
  }
  function daily(s) {
    return { day: s.day, startCash: s.cash, startHealth: s.health, startRep: s.rep,
      startDisgust: disgust(s), income: { slices: 0, drinks: 0, recycling: 0, events: 0 },
      expenses: { ingredients: 0, supplies: 0, upgrades: 0, food: 0, events: 0 },
      potential: 0, served: 0, passed: 0, soldOut: 0, turnedAway: 0, closed: 0,
      reactions: { delighted: 0, satisfied: 0, neutral: 0, disgusted: 0 },
      sales: {}, drinks: 0, spoiledSlices: 0, wastedDough: 0, spoiledToppings: 0,
      events: [], milestones: [], early: false, finalized: false };
  }
  function create(seed) {
    const s = { version: C.saveVersion, phase: 'management', day: 1, cash: C.startingCash,
      health: C.startingHealth, rep: C.startingRep, dirt: 0, rats: 0, waste: 0,
      xp: 0, price: C.price.start, rng: (seed === undefined ? Date.now() ^ Math.floor(Math.random() * 0xffffffff) : seed) >>> 0,
      inventory: { dough: 0, slices: 0 }, lots: {}, upgrades: [], menu: ['plain'],
      trained: false, recycled: false, windfall: false, sympathyUsed: false, action: null,
      tomorrow: { bonus: 0, multiplier: 1 }, modifiers: { bonus: 0, multiplier: 1 },
      dayRun: null, report: null, history: [], log: [], logId: 0, endReason: null,
      stats: { income: 0, spending: 0, slices: 0, customers: 0, days: 0, bestRevenue: 0, bestSlices: 0 },
      unlocks: [], pendingMilestones: [], wheelchairBuilt: false, lastCustomer: null, bestsRecorded: false, final: null };
    P.DATA.items.forEach(i => { s.inventory[i.id] = 0; if (i.group === 'toppings') s.lots[i.id] = []; });
    s.today = daily(s);
    log(s, 'system', 'A roadside stand. A questionable microwave. $64 and a plan.');
    return s;
  }
  function skill(s) { return Math.min(C.skillMax, Math.floor(s.xp / C.skillXP)); }
  function disgust(s) { return clamp(s.dirt + s.rats * C.disgust.perRat, 0, C.disgust.max); }
  function capacity(s) { return Math.max(1, Math.floor(s.health + skill(s) + s.upgrades.reduce((v, id) => v + C.upgrades[id].capacity, 0))); }
  function slots(s) { return C.slots.reduce((v, [at, n]) => s.stats.slices >= at ? n : v, 1) + (s.upgrades.includes('tiny_menu_board') ? C.upgrades.tiny_menu_board.slots : 0); }
  function unlocked(s, id) { return !(id in C.toppingUnlocks) || s.stats.slices >= C.toppingUnlocks[id]; }
  function recipeUnlocked(s, recipe) { return recipe.ingredients.every(id => unlocked(s, id)); }
  function recipeStocked(s, recipe) { return recipe.ingredients.every(id => s.inventory[id] > 0); }
  function money(s, cents, category) {
    if (!Number.isInteger(cents) || s.cash + cents < 0) throw new Error('Invalid cash transaction');
    s.cash += cents;
    if (cents >= 0) { s.today.income[category] += cents; s.stats.income += cents; }
    else { s.today.expenses[category] -= cents; s.stats.spending -= cents; }
  }
  function rep(s, delta) { s.rep = Math.max(0, s.rep + delta); }
  function gainXP(s, amount) {
    const old = skill(s);
    s.xp = Math.min(C.skillMax * C.skillXP, s.xp + amount);
    if (skill(s) > old) log(s, 'unlock', `Skill level ${skill(s)}. Each click does more work. Serving capacity increased.`);
  }
  function score(s) { return Math.round((s.stats.income - s.stats.spending) / 100 + s.rep * C.score.reputation + s.stats.slices * C.score.slices + s.stats.days * C.score.days + disgust(s) * C.score.disgust); }
  P.State = { create, daily, random, log, sum, clamp, skill, disgust, capacity, slots, unlocked, recipeUnlocked, recipeStocked, money, rep, gainXP, score };
})(Pizza);

</script>
<script>
(function (P) {
  'use strict';
  const C = P.CONFIG, S = P.State;
  function trigger(s, id) {
    const event = P.DATA.events.find(e => e.id === id);
    if (!event) return false;
    let effect = '';
    switch (id) {
      case 'big_game': s.tomorrow.bonus += C.events.bigGame; effect = `Tomorrow: +${C.events.bigGame} potential customers.`; break;
      case 'rain': s.tomorrow.multiplier *= C.events.rain; effect = 'Tomorrow: half the usual foot traffic.'; break;
      case 'scratch': S.money(s, C.events.scratch, 'events'); effect = `+$${(C.events.scratch / 100).toFixed(2)} cash.`; break;
      case 'good_tv': S.rep(s, C.events.interview); effect = `+${C.events.interview} reputation.`; break;
      case 'bad_tv': S.rep(s, -C.events.interview); effect = `−${C.events.interview} reputation (minimum 0).`; break;
      case 'cat': S.rep(s, C.events.catRep); s.dirt = Math.min(C.disgust.max, s.dirt + C.events.catDirt); effect = '+1 reputation, +1 dirt.'; break;
      case 'garbage': s.dirt = 0; s.rats = 0; effect = 'Dirt and rats cleared. Your refundable cans stay in their crate.'; break;
      case 'windfall': s.windfall = true; effect = `Your next recycling payout is ×${C.recycling.windfall}.`; break;
      case 'weekend': s.modifiers.bonus += C.events.weekend; effect = `Today: +${C.events.weekend} potential customers.`; break;
      case 'rats': s.rats += 1; effect = '+1 rat, +1 disgust. Clean the counter before opening tomorrow.'; break;
      case 'wheelchair':
        if (s.wheelchairBuilt || s.waste < C.recycling.capacity) return false;
        s.waste = 0; s.wheelchairBuilt = true; S.rep(s, C.recycling.wheelchairRep);
        effect = `${C.recycling.capacity} cans redeemed for the neighbourhood wheelchair build. +${C.recycling.wheelchairRep} reputation. No cash payout; the refund goes to the project.`;
        break;
      case 'sympathy':
        if (s.sympathyUsed) return false;
        s.sympathyUsed = true; S.money(s, C.events.sympathyCash, 'events');
        effect = `+$${(C.events.sympathyCash / 100).toFixed(2)}. Once per run.`; break;
    }
    s.today.events.push({ id, name: event.name, text: event.text, effect });
    S.log(s, 'event', `${event.name} — ${event.text} ${effect}`);
    return true;
  }
  function randomEvent(s) {
    const pool = P.DATA.events.filter(e => e.type === 'random');
    return trigger(s, pool[Math.floor(S.random(s) * pool.length)].id);
  }
  function begin(s) {
    if (C.events.weekendDays.includes(s.day % C.events.weekLength)) trigger(s, 'weekend');
  }
  function end(s) {
    if (S.random(s) < C.events.chance) randomEvent(s);
    if (s.today.spoiledSlices && S.random(s) < Math.min(C.events.ratMaxChance, s.today.spoiledSlices * C.events.ratPerSlice)) trigger(s, 'rats');
  }
  P.Events = { trigger, randomEvent, begin, end };
})(Pizza);

<script>
/* The review adapter translates checkpoint state into the one-day surface.
   Simulation, transactions, probability, work, settlement and save validation
   are supplied by the unmodified candidate modules above. */
(() => {
  'use strict';
  const P = window.Pizza;
  const C = P.CONFIG;
  const copy = JSON.parse(document.getElementById('stand-copy').textContent);
  const seed = 6;
  const ids = ['flour', 'sauce', 'cheese', 'napkins', 'paper_plates'];
  const supportedStock = new Set(ids);
  const cash = cents => '$' + (cents / 100).toFixed(2);
  const fill = (template, params = {}) => template.replace(/\{(\w+)\}/g, (token, k) => params[k] ?? token);
  const entriesByEffect = new Map();
  copy.events.forEach(entry => {
    if (!entriesByEffect.has(entry.effect)) entriesByEffect.set(entry.effect, []);
    entriesByEffect.get(entry.effect).push(entry);
  });
  const cost = id => id === 'microwave' ? C.upgrades.clean_microwave.cost : C.inventoryCosts[id];

  // These keys belong exclusively to this prototype, including on a file URL.
  for (const slot of ['run', 'bests', 'settings']) C.keys[slot] = 'roadside.one-day.design-v1.' + slot;
  const naturalEnd = P.Events.end;
  const reviewHash = new URLSearchParams(window.location.hash.slice(1));
  const forcedEvent = reviewHash.get('event');
  const previewEvent = copy.events.find(e => e.id === forcedEvent);
  const previewType = P.DATA.events.find(e => e.id === previewEvent?.effect)?.type;
  for (const [k, lines] of Object.entries(copy.reactions)) P.DATA.reactions[k] = [...lines];
  P.DATA.recipes.find(r => r.id === 'plain').name = copy.names.plain;
  function configureEvent(day) {
    for (const event of P.DATA.events) {
      const choices = entriesByEffect.get(event.id);
      const content = choices[(day - 1) % choices.length];
      event.name = content.title;
      event.text = content.message;
    }
  }
  P.Events.end = s => {
    if (forcedEvent === 'none') return;
    if (previewEvent && ['random', 'conditional'].includes(previewType)) {
      const entry = P.DATA.events.find(e => e.id === previewEvent.effect);
      entry.name = previewEvent.title;
      entry.text = previewEvent.message;
      if (P.Events.trigger(s, previewEvent.effect)) s.today.events.at(-1).copyId = previewEvent.id;
      return;
    }
    naturalEnd(s);
  };
  const loaded = P.Save.load();
  let state = loaded.state || P.State.create(seed);
  configureEvent(state.day);
  // The engine validates its own save. Keep optional presentation history
  // tolerant of old or damaged entries without discarding a playable run.
  if (Array.isArray(state.reviewLog)) {
    state.reviewLog = state.reviewLog.filter(row => row && Object.hasOwn(copy.counter, row.key) &&
      row.params && typeof row.params === 'object' && typeof row.time === 'string' &&
      typeof row.kind === 'string').slice(-C.maxLog);
  }
  let checkpoint = null;
  let paused = false;
  let panelOpen = false;
  let notice = loaded.notice ? (loaded.state ? copy.feedback.restore : copy.feedback.incompatible) :
    (!loaded.state ? copy.feedback.start : '');
  let saveNotice = '';
  let lastTime = performance.now();
  let lastPaint = '';
  const logEntries = () => Array.isArray(state.reviewLog) ? state.reviewLog : [];
  function addLog(key, params, kind, number) {
    state.reviewLog = logEntries();
    const elapsed = state.dayRun?.elapsed ?? (key === 'closed' ? C.daySeconds : 0);
    const duration = state.dayRun?.duration ?? C.daySeconds;
    state.reviewLog.push({ key, params, kind, number, time: clock(elapsed / duration) });
    if (state.reviewLog.length > C.maxLog) state.reviewLog.shift();
  }
  function clock(fraction) {
    const minute = 11 * 60 + Math.floor(Math.min(1, fraction) * 8 * 60);
    return String(Math.floor(minute / 60)).padStart(2, '0') + ':' + String(minute % 60).padStart(2, '0');
  }
  function persist() {
    if (!P.Save.save(state, checkpoint)) saveNotice = copy.feedback.saveUnavailable;
  }
  function missingResources() {
    return ['dough', 'sauce', 'cheese'].filter(id => !state.inventory[id]);
  }
  function workReason(kind) {
    if (state.phase !== 'management') return copy.feedback.beforeOpen;
    if (state.action) return state.action.type === kind ? '' : copy.feedback.finishWork;
    if (kind === 'dough') return state.inventory.flour ? '' : copy.feedback.noFlour;
    const missing = missingResources();
    return missing.length ? fill(copy.feedback.noIngredients, {
      items: missing.map(id => '1 ' + (copy.names[id] || id).toLowerCase()).join(' + ')
    }) : '';
  }
  function openReason() {
    if (state.phase !== 'management') return copy.feedback.beforeOpen;
    if (state.action) return copy.feedback.finishWork;
    if (!state.health) return copy.feedback.noHealth;
    const microwave = state.upgrades.includes('clean_microwave');
    if (!state.inventory.slices) return microwave ? copy.feedback.noTray : copy.feedback.noMicrowaveOrTray;
    return microwave ? '' : copy.feedback.noMicrowave;
  }
  function availableToBuy(id) {
    if (state.phase !== 'management') return copy.feedback.beforeOpen;

  }

  }

  function effectSummary(id) {
    const E = C.events;

      big_game: { count: E.bigGame }, rain: { percent: 100 * E.rain },
      scratch: { cash: cash(E.scratch) }, good_tv: { rep: E.interview }, bad_tv: { rep: E.interview },
      cat: { rep: E.catRep, dirt: E.catDirt }, garbage: {}, windfall: { multiple: C.recycling.windfall },
      weekend: { count: E.weekend }, rats: {}, sympathy: { cash: cash(E.sympathyCash) },
      wheelchair: { count: C.recycling.capacity, rep: C.recycling.wheelchairRep }
    };
    return fill(copy.effects[id], values[id]);
  }
  function receiptFor(r) {
    const events = r.events.map(e => {
      const candidates = entriesByEffect.get(e.id);
      const content = copy.events.find(v => v.id === e.copyId) || candidates[(r.day - 1) % candidates.length];
      return { title: content.title, message: content.message, effect: effectSummary(e.id) };
    });
    let template = copy.receipt.sellThroughClue, count = 0;
    if (r.soldOut) { template = copy.receipt.stockClue; count = r.soldOut; }
    else if (r.turnedAway) { template = copy.receipt.capacityClue; count = r.turnedAway; }
    else if (r.passed) template = state.inventory.napkins ? copy.receipt.wasteClue : copy.receipt.supplyClue;
    else if (r.spoiledSlices) { template = copy.receipt.overprepClue; count = r.spoiledSlices; }
    const clue = fill(template, { count, passed: r.passed, visitors: r.potential });
    return { prepared: r.served + r.spoiledSlices, sold: r.served, leftovers: r.spoiledSlices,
      sales: r.revenue, spending: r.expenseTotal, change: r.net, clue, events,
      eventTitle: events.map(e => e.title).join(' / '),
      eventMessage: events.length ? events.map(e => e.message + ' ' + e.effect).join(' ') : copy.receipt.quiet,
      startCash: r.startCash, endCash: r.endCash, healthChange: r.healthChange,
      visitors: r.potential, passed: r.passed, soldOut: r.soldOut };
  }
  function viewModel() {
    const phase = state.phase === 'management' ? 'prep' : state.phase === 'day' ? 'service' : 'report';
    const run = state.dayRun, t = state.today, r = state.report;
    const receipt = r ? receiptFor(r) : null;
    const work = state.action ? { kind: state.action.type === 'prepare' ? 'slices' : 'dough',
      progress: Math.round(100 * (1 - state.action.remaining / state.action.total)) } : null;
    const noDough = workReason('dough'), noSlices = workReason('prepare'), noOpen = openReason();
    const costs = {}, canBuy = {}, buyReason = {};
    for (const id of [...ids, 'microwave']) {
      costs[id] = cost(id); buyReason[id] = availableToBuy(id); canBuy[id] = !buyReason[id];
    }
    return { phase, day: state.day, cash: state.cash, health: state.health, reputation: state.rep, price: state.price,
      stock: { ...state.inventory }, costs, microwave: state.upgrades.includes('clean_microwave'), work,
      workStep: { dough: P.Logic.clickPower(state, 'dough'), slices: P.Logic.clickPower(state, 'prepare') },
      forecast: { visitors: run || receipt ? t.potential : P.Customers.forecast(state), capacity: P.State.capacity(state),
        chance: Math.round(P.Customers.chance(state) * 1000) / 10 },
      prepared: receipt?.prepared ?? (state.inventory.slices + t.served), sold: t.served,
      possibleSales: state.inventory.slices * state.price, sales: t.income.slices + t.income.drinks, spending: P.State.sum(t.expenses), openingCash: t.startCash,
      paused, visitorsSeen: run?.customer?.number ?? (receipt ? t.potential : 0),
      serviceProgress: run ? run.elapsed / run.duration : receipt ? 1 : 0,
      log: logEntries().map(row => ({ time: row.time, text: entryLine(row), kind: row.kind, visitor: row.number })),
      reaction: currentOutcome(), receipt, notice, saveNotice, ready: !noOpen, openReason: noOpen,
      canBuy, buyReason, canDough: !noDough, canPrepare: !noSlices, workReasons: { dough: noDough, slices: noSlices },
      priceMin: C.price.min, priceMax: C.price.max, priceStep: C.price.step, batchSize: C.slicesPerBatch,
      dayTerminal: state.phase === 'score' || (phase === 'report' && (state.health === 0 || state.day >= C.maxDays)) };
  }
  function render() {
    window.StandView.render(viewModel(), copy);
  }
  function reset() {
    checkpoint = null; paused = false; panelOpen = false; saveNotice = ''; lastPaint = '';
    state = P.State.create(seed); configureEvent(1); notice = copy.feedback.start; persist(); render();
  }
  function action(name, id) {
    if (name === 'panel') { panelOpen = id === true || id === 'true'; lastTime = performance.now(); return; }
    if (name === 'reset') { reset(); return; }
    if (name === 'pause') {
      if (state.phase === 'day') { paused = !paused; lastTime = performance.now(); render(); }
      return;
    }
    if (name === 'next') {
      if (state.phase !== 'report') return;
      if (viewModel().dayTerminal) { reset(); return; }
      // An end-of-day modifier may refer to the next day's event copy.
      configureEvent(state.day + 1);
      P.Logic.continueDay(state);
      state.reviewLog = []; notice = copy.feedback.newDay; persist(); render(); return;
    }
    if (state.phase !== 'management') return;
    let type = name, item = id;
    if (name === 'work') type = id === 'slices' ? 'prepare' : id;
    if (name === 'microwave' || (name === 'buy' && item === 'microwave')) { type = 'upgrade'; item = 'clean_microwave'; }
    if (type === 'price' && (String(id) === '1' || String(id) === '-1')) item = Number(id) === 1 ? 'up' : 'down';
    if (!['buy', 'upgrade', 'dough', 'prepare', 'price', 'open'].includes(type)) return;
    if (type === 'buy' && !supportedStock.has(item)) return;
    if (type === 'upgrade' && item !== 'clean_microwave') return;
    if (type === 'open') {
      const why = openReason();
      if (why) { notice = why; render(); return; }
      checkpoint = P.Save.clone(state);
    }
    const result = P.Logic.action(state, type, item);
    if (!result.ok) {
      notice = type === 'buy' || type === 'upgrade' ? availableToBuy(type === 'upgrade' ? 'microwave' : item) :
        workReason(type); render(); return;
    }
    switch (type) {
      case 'buy': notice = fill(copy.feedback.bought, { item: copy.names[item], cost: cash(cost(item)) }); break;
      case 'upgrade': notice = fill(copy.feedback.installed, { cost: cash(cost('microwave')) }); break;
      case 'dough':
      case 'prepare': {
        const makingDough = type === 'dough';
        if (!state.action) notice = makingDough ? copy.feedback.doughReady : fill(copy.feedback.slicesReady, { batch: C.slicesPerBatch });
        else notice = fill(makingDough ? copy.feedback.doughWorking : copy.feedback.slicesWorking,
          { progress: Math.round(100 * (1 - state.action.remaining / state.action.total)) });
        break;
      }
      case 'price': notice = fill(copy.feedback.price, { price: cash(state.price) }); break;
      case 'open':
        state.reviewLog = []; notice = ''; paused = false; lastTime = performance.now(); lastPaint = '';
        addLog('opened', { visitors: state.today.potential }, 'open', 0);
        break;
    }
    persist(); render();
  }
  // Small steps preserve the checkpoint's separate arrival and decision beats.
  // Hidden tabs and secondary panels suspend the review's wall clock.
  function tick() {
    const now = performance.now();
    const delta = Math.min((now - lastTime) / 1000, 0.3);
    lastTime = now;
    if (document.hidden || paused || panelOpen || state.phase !== 'day') return;
    const before = state.dayRun.customer;
    P.Logic.tick(state, delta);
    if (state.phase === 'report') {
      addLog('closed', { sold: state.today.served }, 'close', 0);
      checkpoint = null; notice = ''; persist(); render(); return;
    }
    const current = state.dayRun.customer;
    if (current && current.number !== before?.number)
      addLog('arrived', { n: current.number }, 'arrival', current.number);
    if (current?.stage === 'result' && (before?.stage !== 'result' || before.number !== current.number))
      recordOutcome(current);
    // The first day is below all milestones. Later continuing samples use the
    // same checkpoint unlocks; acknowledge them after settlement of each beat.
    if (state.pendingMilestones.length) state.pendingMilestones = [];
    const frameKey = Math.floor(state.dayRun.elapsed * 4) + '/' + (current?.number || 0) + '/' + current?.stage;
    if (frameKey !== lastPaint) { lastPaint = frameKey; render(); }
  }
  window.Stand = { action };
  document.addEventListener('stand-action', event => action(event.detail.action, event.detail.id));
  document.addEventListener('visibilitychange', () => { lastTime = performance.now(); });
  window.setInterval(tick, 120);
  render();
})();

</script>
</body></html>
