name: Days 1–5 review
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  playable-review:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify portable HTML
        run: |
          python3 package.py
          git diff --exit-code -- pizza-place-tycoon.html
          cd checkpoint
          sha256sum -c SHA256SUMS
      - name: Check rules, saves and five-day continuation
        run: npm test
      - name: Install browser checks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Exercise keyboard and all three review sizes
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playable-days-1-5-review
          path: |
            pizza-place-tycoon.html
            review-output/
